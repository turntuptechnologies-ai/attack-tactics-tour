version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # three は r128 に固定している（新しい版は光と色の扱いが変わり、見た目が変わるため）。
      # 上げるときは見た目を確認しながら手動で行う。
      - dependency-name: "three"
      - dependency-name: "@types/three"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
